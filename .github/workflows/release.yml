name: Publish Foundry release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version and run tests
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("module.json", "utf8"));
            assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
            assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`);
          '
          npm test
      - name: Package module
        run: |
          mkdir -p release
          git archive --format=zip --output=release/atlas-foundry.zip HEAD module.json README.md assets languages scripts styles templates
          cp module.json release/module.json
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('release/atlas-foundry.zip') as archive:
              assert archive.testzip() is None
              assert archive.read('module.json') == Path('release/module.json').read_bytes()
              manifest = json.loads(archive.read('module.json'))
              for path in manifest['esmodules'] + manifest['styles'] + [item['path'] for item in manifest['languages']]:
                  assert path in archive.namelist(), path
          PY
      - name: Upload assets and publish as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release/state.json; then
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              assert.equal(JSON.parse(readFileSync("release/state.json", "utf8")).isDraft, true, "Release is already published");
            '
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release/atlas-foundry.zip release/module.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
